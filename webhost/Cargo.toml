[package]
name = "hghubx-web"
version = "2.1.2"
description = "Loopback browser host for the HGhubX web shell"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
